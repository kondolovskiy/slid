<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Слід</title>
<meta name="description" content="Інтерактивні уроки українською для 4–11 класів. Працює без інтернету.">
<meta name="theme-color" content="#F1F0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Слід">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F1F0EC; --bg-deep:#E6E3DD; --surface:#FFFFFF; --ink:#1F1A17; --muted:#6B625B; --line:#DDD7CF;
  --accent:#A8431F; --accent-ink:#FFFFFF; --accent-soft:#F3E3DA;
  --gold:#B7791F; --gold-soft:#F6EAD2; --flame:#D2551E;
  --ok:#2E7D4F; --ok-soft:#E1F1E6; --bad:#B8322A; --bad-soft:#F8E2DF;
  --chip:#F6F4F0; --lock:#B9B1A8; --shadow:0 1px 0 rgba(31,26,23,.05),0 6px 20px rgba(31,26,23,.06);
  --display:"Unbounded",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --appw:480px; --mathf:"Noto Serif","Cambria","Times New Roman",serif;
  --accent-mid:#D98E6E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#161311; --bg-deep:#0E0C0B; --surface:#221D1A; --ink:#EFE9E2; --muted:#A99F96; --line:#3A322D;
  --accent:#E0764E; --accent-ink:#1A1310; --accent-soft:#3A2419; --gold:#E3A94A; --gold-soft:#3A2D16; --flame:#F08A4B;
  --ok:#5CC08A; --ok-soft:#173226; --bad:#F07A6E; --bad-soft:#3A1C19; --chip:#2A2420; --lock:#5A514A; --shadow:0 1px 0 rgba(0,0,0,.35); --accent-mid:#8A4A33;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#161311; --bg-deep:#0E0C0B; --surface:#221D1A; --ink:#EFE9E2; --muted:#A99F96; --line:#3A322D;
  --accent:#E0764E; --accent-ink:#1A1310; --accent-soft:#3A2419; --gold:#E3A94A; --gold-soft:#3A2D16; --flame:#F08A4B;
  --ok:#5CC08A; --ok-soft:#173226; --bad:#F07A6E; --bad-soft:#3A1C19; --chip:#2A2420; --lock:#5A514A; --shadow:0 1px 0 rgba(0,0,0,.35); --accent-mid:#8A4A33;
}
*{box-sizing:border-box}
html{background:var(--bg-deep)}
body{background:var(--bg-deep);color:var(--ink);font:16px/1.55 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{max-width:var(--appw);margin:0 auto;min-height:100vh;background:var(--bg);padding-inline:16px;padding-block:0 96px;position:relative}
.fixed{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,var(--appw));z-index:20}
svg{display:block}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;font:700 17px var(--display);letter-spacing:.01em;margin-right:auto}
.brand svg{width:28px;height:28px;color:var(--accent)}
.chip{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font:700 14px var(--body);font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}
.chip.flame{color:var(--flame)} .chip.xp{color:var(--gold)}
.chip.off{color:var(--lock)}
.ring{width:34px;height:34px;position:relative}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 10px var(--body);color:var(--muted)}

/* bottom tabs */
.tabs{bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:12px;font:600 12px var(--body);color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab:focus-visible{outline:3px solid var(--accent)}

h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(23px,6vw,29px)} h2{font-size:clamp(19px,5vw,23px)} h3{font-size:16px}
p{margin:0 0 12px}
.eyebrow{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* path */
.sec{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px;margin-top:4px;display:grid;gap:10px;position:relative;overflow:hidden}
.sec .eyebrow{color:inherit;opacity:.8}
.sec h2{color:inherit}
.sec .why{font-size:14px;opacity:.92;margin:0}
.sec .pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
:root[data-theme="dark"] .sec .pbar{background:rgba(0,0,0,.25)}
.sec .pbar i{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
.sec .deco{position:absolute;right:-26px;top:-26px;width:130px;height:130px;opacity:.16;color:var(--accent-ink)}
.path{position:relative;display:grid;gap:22px;padding-block:28px 10px}
.node{display:grid;justify-items:center;gap:6px;width:150px}
.node:nth-child(4n+1){margin-left:calc(50% - 75px)} .node:nth-child(4n+2){margin-left:calc(50% - 150px + 40px)}
.node:nth-child(4n+3){margin-left:calc(50% - 75px)} .node:nth-child(4n){margin-left:calc(50% - 40px)}
.nbtn{all:unset;cursor:pointer;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--surface);border:3px solid var(--line);color:var(--muted);box-shadow:0 5px 0 var(--line);transition:transform .1s}
.nbtn svg{width:34px;height:34px}
.nbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.nbtn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.node.done .nbtn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.node.cur .nbtn{background:var(--surface);border-color:var(--accent);color:var(--accent);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.node.cur .nbtn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--accent);opacity:.35;animation:pulse 1.8s ease-out infinite}
.node.boss .nbtn{border-radius:22px;width:84px;height:84px}
.node.lock .nbtn{color:var(--lock);cursor:pointer}
.nlabel{font:600 13px/1.3 var(--body);text-align:center}
.node.lock .nlabel{color:var(--muted)}
.stars{display:flex;gap:2px;color:var(--gold)} .stars svg{width:15px;height:15px}
.stars .off{color:var(--line)}
.bubble{background:var(--ink);color:var(--bg);font:700 12px var(--body);padding:4px 10px;border-radius:8px;position:relative;margin-bottom:2px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--ink)}
@keyframes pulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.15);opacity:0}}
.later{margin-top:24px;display:grid;gap:10px}
.later .card{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:14px}
.later .card svg{flex:none;width:22px;height:22px;color:var(--lock);margin-top:2px}
.later .card p{margin:4px 0 0;font-size:14px;color:var(--muted)}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(15,12,10,.45);z-index:40;display:grid;align-items:end;justify-items:center}
.sheet{width:min(100%,var(--appw));background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:up .25s ease both}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);justify-self:center}
.why-box{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:15px}
.why-box b{color:var(--accent)}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.meta .st-draft{color:var(--gold);border-color:var(--gold)} .meta .st-verified{color:var(--ok);border-color:var(--ok)}
.meta span{font:600 13px var(--body);background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--muted)}
@keyframes up{from{transform:translateY(30px);opacity:.001}to{transform:none;opacity:1}}

/* buttons */
.btn{all:unset;box-sizing:border-box;text-align:center;cursor:pointer;padding:15px 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--body);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn.danger{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}

/* progress view */
.stack{display:grid;gap:14px;padding-top:4px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lvl .badge-lvl{width:64px;height:64px;border-radius:18px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font:700 26px var(--display)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:grid;gap:2px}
.stat svg{width:20px;height:20px}
.stat b{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);line-height:1.3}
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:auto;overflow:visible}
.chart-wrap .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:600 12px var(--body);padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.skill{display:grid;gap:6px}
.skill + .skill{margin-top:12px}
.skill .row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.skill .row b{font-weight:600}
.skill .bar i{background:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{display:grid;justify-items:center;gap:6px;text-align:center;font:600 11px/1.25 var(--body)}
.bdg .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);border:2px solid var(--gold)}
.bdg .medal svg{width:26px;height:26px}
.bdg.off .medal{background:var(--chip);color:var(--lock);border:2px dashed var(--line)}
.bdg.off{color:var(--muted)}
.empty{font-size:14px;color:var(--muted);background:var(--chip);border-radius:12px;padding:10px 12px}

/* profile */
.who{display:flex;gap:14px;align-items:center}
.avatar{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 24px var(--display)}
.field{display:grid;gap:6px}
.field input{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.field input:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 14px;border-radius:99px;background:var(--chip);border:1.5px solid var(--line);font:500 14px var(--body)}
.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{all:unset;cursor:pointer;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch[aria-checked="true"]{background:var(--ok)} .switch[aria-checked="true"]::after{left:23px}
.switch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.credits{font-size:12px;color:var(--muted);line-height:1.5;margin:0;padding-left:18px}
.credits a{color:inherit}

/* player */
.player{position:fixed;inset:0;z-index:30;background:var(--bg-deep);overflow-y:auto}
.player .inner{max-width:var(--appw);margin:0 auto;min-height:100%;background:var(--bg);padding-inline:16px;padding-block:0 220px}
.phead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.x:hover{background:var(--chip)} .x:focus-visible{outline:3px solid var(--accent)}
.x svg{width:22px;height:22px}
.pbar2{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar2 i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s ease}
.combo{font:700 14px var(--body);color:var(--flame);display:flex;align-items:center;gap:3px;min-width:44px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.combo svg{width:16px;height:16px}
.combo.pop{animation:pop .4s ease}
@keyframes pop{50%{transform:scale(1.35)}}
.screen{animation:in .3s ease both;display:grid;gap:4px}
.screen:focus{outline:none}   /* запасна ціль фокуса (focusAction), не елемент керування */
.screen h1,.screen h2{margin:6px 0 10px}
.lead{font-size:18px}
figure{margin:6px 0 14px;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
figure img{display:block;width:100%;max-height:300px;object-fit:cover}
figure.fit img{object-fit:contain;background:#fff;max-height:280px;padding:10px}
figure.tall img{object-fit:contain;background:#000;max-height:340px}
figure.svgfig{padding:12px;color:var(--ink)}
figure.svgfig svg{width:100%;height:auto}
figcaption{font-size:13px;color:var(--muted);padding:8px 12px;line-height:1.4}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--surface);border:2px solid var(--line);border-radius:14px;cursor:pointer;line-height:1.4;box-shadow:0 3px 0 var(--line);transition:border-color .15s,background .15s}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;min-width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font:700 13px var(--body);color:var(--muted);padding:0 4px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt[aria-pressed="true"] .k{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.opt.is-ok .k{border-color:var(--ok);background:var(--ok);color:var(--accent-ink)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt[disabled]{cursor:default}
.sort{display:grid;gap:10px;margin-top:10px}
.srow{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.srow.is-ok{border-color:var(--ok);background:var(--ok-soft)} .srow.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.srow b{font-weight:600}
.fix{font-size:14px;color:var(--muted)}
.slider{background:var(--surface);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-top:10px}
.slider output{display:block;font:700 34px var(--display);font-variant-numeric:tabular-nums;color:var(--accent);text-align:center}
.slider input{width:100%;accent-color:var(--accent);margin:12px 0 4px}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.align{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-top:10px;display:grid;gap:10px}
.align svg{width:100%;height:auto}
.align .readout{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:var(--muted)}
.align .readout b{font:700 24px var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.align input{width:100%;accent-color:var(--accent)}
.hint{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px;display:flex;gap:8px;margin-top:10px}
.hint svg{flex:none;width:18px;height:18px;color:var(--gold);margin-top:3px}
.note{margin-top:12px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.note summary{display:flex;gap:8px;align-items:center;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;list-style:none}
.note summary::-webkit-details-marker{display:none}
.note summary svg{flex:none;width:18px;height:18px}
.note[open] summary{color:var(--ink)}
.note-b{padding:0 12px 10px}
.note-b ul{margin:6px 0 0;padding-left:18px}
.note-b a{color:inherit}

.dock{bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);transition:background .2s;z-index:35}
.dock.ok{background:var(--ok-soft);border-color:var(--ok)} .dock.bad{background:var(--bad-soft);border-color:var(--bad)} .dock.info{background:var(--accent-soft);border-color:var(--accent)}
.dock .in{display:grid;gap:10px}
.fb{display:none;gap:4px}
.dock.ok .fb,.dock.bad .fb,.dock.info .fb{display:grid}
.fb strong{font:700 17px var(--display);display:flex;align-items:center;gap:8px}
.fb strong .gain{font:700 13px var(--body);color:var(--gold);background:var(--surface);border-radius:99px;padding:2px 8px}
.dock.ok .fb strong{color:var(--ok)} .dock.bad .fb strong{color:var(--bad)} .dock.info .fb strong{color:var(--accent)}
.fb p{margin:0;font-size:15px;max-height:30vh;overflow:auto}
.dock.ok .btn{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.dock.bad .btn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}

/* lesson end */
.endhero{display:grid;justify-items:center;text-align:center;gap:10px;padding-top:18px}
.bigstars{display:flex;gap:6px;color:var(--gold)}
.bigstars svg{width:52px;height:52px}
.bigstars .off{color:var(--line)}
.bigstars svg{animation:starin .5s cubic-bezier(.3,1.6,.5,1) both}
.bigstars svg:nth-child(2){animation-delay:.15s;transform:translateY(-10px)} .bigstars svg:nth-child(3){animation-delay:.3s}
@keyframes starin{from{transform:scale(.2);opacity:.001}}
.gains{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.newbadge{display:flex;gap:12px;align-items:center;background:var(--gold-soft);border:2px solid var(--gold);border-radius:16px;padding:12px 14px;text-align:left}
.newbadge .medal{flex:none;width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--gold);display:grid;place-items:center}
.newbadge .medal svg{width:24px;height:24px}
.levelup{background:var(--ink);color:var(--bg);border-radius:16px;padding:14px;text-align:center;width:100%}
.levelup b{font:700 20px var(--display);display:block}
.learned{display:grid;gap:8px;width:100%;text-align:left}
