# Слід · бекенд: типи, модульні тести, e2e на справжньому Postgres.
name: Server

on:
  push:
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slid
          POSTGRES_PASSWORD: slid
          POSTGRES_DB: slid_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U slid" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://slid:slid@localhost:5432/slid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:e2e
