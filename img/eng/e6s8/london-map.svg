<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
  <title>A simple map of central London: the Thames and five famous places</title>
  <rect x="0" y="0" width="640" height="420" fill="#f4f1ea"/>
  <!-- Parks near Buckingham Palace -->
  <ellipse cx="150" cy="232" rx="58" ry="30" fill="#bfe0a8" stroke="#7aa35e" stroke-width="2"/>
  <text x="150" y="237" font-size="13" fill="#3d5f2a">park</text>
  <!-- The River Thames -->
  <path d="M 205 420 C 215 360, 235 300, 245 250 C 255 200, 300 165, 370 168 C 440 172, 500 200, 560 215 C 590 222, 615 228, 640 232" fill="none" stroke="#7fb2e0" stroke-width="30" stroke-linecap="butt"/>
  <text x="420" y="187" font-size="15" font-style="italic" fill="#1f4f7a">the Thames</text>
  <!-- Westminster Bridge -->
  <line x1="222" y1="262" x2="272" y2="262" stroke="#8a8a8a" stroke-width="7"/>
  <!-- Tower Bridge -->
  <line x1="545" y1="190" x2="535" y2="236" stroke="#8a8a8a" stroke-width="7"/>
  <text x="590" y="268" font-size="13" fill="#444444">Tower Bridge</text>
  <!-- Big Ben -->
  <circle cx="210" cy="275" r="9" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <text x="168" y="300" font-size="15" font-weight="bold" fill="#222222">Big Ben</text>
  <!-- London Eye -->
  <circle cx="285" cy="242" r="9" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <text x="330" y="275" font-size="15" font-weight="bold" fill="#222222">the London Eye</text>
  <!-- Buckingham Palace -->
  <circle cx="70" cy="232" r="9" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <text x="80" y="200" font-size="15" font-weight="bold" fill="#222222">Buckingham Palace</text>
  <!-- British Museum -->
  <circle cx="310" cy="70" r="9" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <text x="310" y="52" font-size="15" font-weight="bold" fill="#222222">the British Museum</text>
  <!-- Tower of London -->
  <circle cx="520" cy="165" r="9" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <text x="520" y="145" font-size="15" font-weight="bold" fill="#222222">the Tower of London</text>
  <!-- North arrow -->
  <line x1="600" y1="80" x2="600" y2="30" stroke="#333333" stroke-width="3"/>
  <path d="M 600 22 L 592 38 L 608 38 Z" fill="#333333"/>
  <text x="600" y="100" font-size="15" font-weight="bold" fill="#333333">N</text>
  <text x="90" y="405" font-size="12" fill="#666666">not to scale</text>
</svg>
